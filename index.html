<!doctype html>
<html lang="uk">
<head>

<meta property="og:description" content="Відкрий — тут листівка для тебе">

<style>
  @font-face{font-family:"Yeseva One";font-style:normal;font-weight:400;font-display:swap;
    src:url(fonts/yeseva-one-cyrillic-400-normal.woff2) format("woff2");
    unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
  @font-face{font-family:"Yeseva One";font-style:normal;font-weight:400;font-display:swap;
    src:url(fonts/yeseva-one-latin-400-normal.woff2) format("woff2");
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD}
  @font-face{font-family:"Lora";font-style:normal;font-weight:400;font-display:swap;
    src:url(fonts/lora-cyrillic-400-normal.woff2) format("woff2");
    unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
  @font-face{font-family:"Lora";font-style:normal;font-weight:400;font-display:swap;
    src:url(fonts/lora-latin-400-normal.woff2) format("woff2");
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD}
  @font-face{font-family:"Lora";font-style:italic;font-weight:400;font-display:swap;
    src:url(fonts/lora-cyrillic-400-italic.woff2) format("woff2");
    unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
  @font-face{font-family:"Lora";font-style:italic;font-weight:400;font-display:swap;
    src:url(fonts/lora-latin-400-italic.woff2) format("woff2");
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD}
  @font-face{font-family:"Lora";font-style:normal;font-weight:600;font-display:swap;
    src:url(fonts/lora-cyrillic-600-normal.woff2) format("woff2");
    unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
  @font-face{font-family:"Lora";font-style:normal;font-weight:600;font-display:swap;
    src:url(fonts/lora-latin-600-normal.woff2) format("woff2");
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD}

  :root{
    --lacquer:#11201B;      /* чорний лак петриківської скриньки, з зеленим відтінком */
    --lacquer-hi:#1F382F;   /* відблиск лаку */
    --kalyna:#D9262F;       /* ягода калини */
    --sunflower:#F3B531;    /* соняшник */
    --leaf:#4F9B3B;         /* листя */
    --cornflower:#4C78E0;   /* волошка */
    --milk:#F6EEDF;         /* текст */
    --milk-soft:rgba(246,238,223,.74);
    --display:"Yeseva One", Georgia, serif;
    --text:"Lora", Georgia, serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100svh;color:var(--milk);font-family:var(--text);
    font-size:clamp(17px, 1.1vw + 12px, 20px);line-height:1.6;
    background:
      radial-gradient(130% 60% at 50% -8%, var(--lacquer-hi) 0%, rgba(31,56,47,0) 62%),
      radial-gradient(90% 50% at 50% 108%, #18302A 0%, rgba(24,48,42,0) 70%),
      var(--lacquer);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  main{position:relative;z-index:1}
  button{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--sunflower);outline-offset:4px;border-radius:6px}
  .defs{position:absolute;width:0;height:0;overflow:hidden}

  /* ——— Вінок ——— */
  .hero{min-height:100svh;display:grid;place-items:center;padding:24px 10px 88px;position:relative}
  .wreath{position:relative;width:min(96vw, 82svh, 600px);aspect-ratio:1}
  .wreath svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  #wreath.spin{animation:spin 160s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
  .center > *{grid-area:1/1}

  .cover{display:grid;justify-items:center;gap:18px;transition:opacity .35s ease, transform .35s ease}
  .cover p{margin:0;font-style:italic;color:var(--milk-soft);font-size:1.05em}
  .open-btn{
    appearance:none;border:0;cursor:pointer;
    background:var(--sunflower);color:#2A1A06;font-weight:600;font-size:1.02em;
    padding:.8em 1.5em;border-radius:999px;
    box-shadow:0 0 0 6px rgba(243,181,49,.16);
    animation:nudge 2.4s ease-in-out infinite;
  }
  @keyframes nudge{0%,100%{box-shadow:0 0 0 6px rgba(243,181,49,.16)}50%{box-shadow:0 0 0 14px rgba(243,181,49,.06)}}
  .open-btn:active{transform:scale(.97)}

  .greet{margin:0;font-weight:400;line-height:1.05;opacity:0;transform:translateY(8px);pointer-events:none;
    transition:opacity .9s ease 1.25s, transform .9s ease 1.25s}
  .greet .l1{display:block;font-family:var(--text);font-style:italic;font-size:clamp(15px, 3.6vw, 24px);color:var(--milk-soft);margin-bottom:.35em}
  .greet .l3{display:block;font-family:var(--display);font-size:clamp(34px, 10.6vw, 72px);letter-spacing:.005em}

  body.opened .cover{opacity:0;transform:scale(.96);pointer-events:none}
  body.opened .greet{opacity:1;transform:none}

  /* мазки пензля */
  .grow{opacity:0;transform:scale(0);transform-box:view-box;transform-origin:0 0}
  .inview .grow{animation:paint .6s cubic-bezier(.2,.85,.3,1.2) forwards;animation-delay:var(--d,0s)}
  @keyframes paint{0%{opacity:0;transform:scale(0)}35%{opacity:1}100%{opacity:1;transform:scale(1)}}
  .stem{fill:none;stroke:#3C7D30;stroke-width:3.2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
  .inview .stem{animation:draw 1.7s cubic-bezier(.45,.05,.3,1) forwards;animation-delay:var(--d,.15s)}
  @keyframes draw{to{stroke-dashoffset:0}}
  .ghost{fill:none;stroke:rgba(246,238,223,.22);stroke-width:1.6;stroke-dasharray:1.5 9;stroke-linecap:round;transition:opacity .6s ease}
  body.opened .ghost{opacity:0}

  .next-btn{
    position:absolute;left:50%;bottom:22px;translate:-50% 0;
    appearance:none;background:none;border:0;cursor:pointer;
    display:grid;justify-items:center;gap:2px;padding:8px 14px;
    color:var(--milk-soft);font-style:italic;font-size:.95em;
    opacity:0;pointer-events:none;transition:opacity .8s ease 2.6s;
  }
  .next-btn svg{width:20px;height:20px;animation:hop 1.6s ease-in-out infinite}
  @keyframes hop{50%{transform:translateY(4px)}}
  body.opened .next-btn{opacity:1;pointer-events:auto}

  /* ——— Сцени ——— */
  .after{display:none}
  body.opened .after{display:block}
  .scene{min-height:88svh;display:grid;place-items:center;padding:40px 12px;position:relative}
  .tree-scene{min-height:auto;padding:14svh 12px 10svh}
  .tree-scene svg{width:min(100%, 640px);height:auto;overflow:visible}
  .bob{animation:none}
  .inview .bob{animation:bob 2.6s ease-in-out infinite alternate;animation-delay:var(--b,2.8s)}
  @keyframes bob{to{transform:translateY(-6px)}}
  .sway,.flap{transform-box:view-box;transform-origin:0 0}
  .inview .sway{animation:sway 3.2s ease-in-out 3s infinite alternate}
  @keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
  .inview .flap{animation:flap 1.3s ease-in-out 3.2s infinite alternate}
  @keyframes flap{from{transform:rotate(2deg)}to{transform:rotate(-12deg)}}

  .cake-scene{align-content:center;justify-items:center;text-align:center;gap:0}
  .cake-scene h2{font-family:var(--display);font-weight:400;font-size:clamp(28px, 7vw, 40px);line-height:1.15;margin:0 0 .2em}
  .cake-scene .hint{color:var(--milk-soft);font-style:italic;margin:0 0 1.6em;min-height:1.6em}
  .cake-wrap{width:min(92vw, 360px)}
  .row{display:flex;justify-content:center;align-items:flex-end;gap:16px;margin-bottom:-1px}
  .candle{appearance:none;background:none;border:0;padding:0;cursor:pointer;width:46px;opacity:0;transform:translateY(-18px)}
  .inview .candle{animation:candleIn .55s cubic-bezier(.2,.85,.3,1.2) forwards;animation-delay:calc(1.1s + var(--i) * .14s)}
  @keyframes candleIn{to{opacity:1;transform:none}}
  .candle svg{display:block;width:100%;height:auto;overflow:visible}
  .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flicker 1.6s ease-in-out infinite alternate}
  .candle:nth-child(2) .flame{animation-duration:1.3s}
  .candle:nth-child(3) .flame{animation-duration:1.9s}
  @keyframes flicker{0%{transform:scale(1,1) rotate(-2deg)}50%{transform:scale(.94,1.06) rotate(1.5deg)}100%{transform:scale(1.03,.96) rotate(-1deg)}}
  .candle.out .flame{animation:blow .45s ease forwards}
  @keyframes blow{to{transform:scale(.2,.1) rotate(25deg);opacity:0}}
  .smoke{fill:none;stroke:rgba(246,238,223,.55);stroke-width:2;stroke-linecap:round;opacity:0}
  .candle.out .smoke{animation:smoke 1.6s ease-out .2s forwards}
  @keyframes smoke{0%{opacity:0;transform:translateY(4px)}25%{opacity:.8}100%{opacity:0;transform:translateY(-26px)}}
  .candle.out{cursor:default}
  #cake{display:block;width:100%;height:auto;overflow:visible}

  .sign{text-align:center;padding:24px 24px 96px;line-height:1.35;color:var(--milk-soft);font-style:italic}
  .sign span{display:block;font-family:var(--display);font-style:normal;color:var(--milk);font-size:1.9em;margin-top:.2em}

  /* ——— Пелюстки й квіти поверх ——— */
  .ambient{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}
  .ambient svg,.petals .petal{position:absolute;top:-40px;animation:fall var(--t) cubic-bezier(.3,.1,.6,1) var(--dl,0s) forwards}
  .ambient svg{opacity:.5}
  @keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx), calc(100vh + 80px)) rotate(var(--r))}}
  .bloom{position:absolute;animation:bloomA 1.9s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes bloomA{0%{transform:scale(0) rotate(-40deg);opacity:1}35%{transform:scale(1) rotate(0)}70%{opacity:1}100%{transform:scale(1.05) rotate(25deg) translateY(26px);opacity:0}}

  @media (prefers-reduced-motion: reduce){
    .grow,.stem,.flame,.smoke,.bob,.sway,.flap,.candle,.open-btn,.next-btn svg,#wreath.spin{animation:none !important}
    .inview .grow,.candle{opacity:1;transform:none}
    .inview .stem{stroke-dashoffset:0}
    .greet,.next-btn{transition-delay:0s !important;transition-duration:.2s !important}
    .candle.out .flame{opacity:0}
  }
</style>
</head>
<body>
<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gRed" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7E0F1A"/><stop offset=".55" stop-color="#C81F2A"/><stop offset="1" stop-color="#F04A45"/>
    </linearGradient>
    <linearGradient id="gPink" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#A3203A"/><stop offset="1" stop-color="#F49AA6"/>
    </linearGradient>
    <linearGradient id="gSun" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#C8661A"/><stop offset="1" stop-color="#FFD860"/>
    </linearGradient>
    <linearGradient id="gMilk" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E7B9B0"/><stop offset=".5" stop-color="#FBEFE6"/><stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1B3488"/><stop offset="1" stop-color="#6C98F2"/>
    </linearGradient>
    <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E68D0"/><stop offset="1" stop-color="#1B3488"/>
    </linearGradient>
    <linearGradient id="gLeaf" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#245A22"/><stop offset="1" stop-color="#6DB84A"/>
    </linearGradient>
    <linearGradient id="gLeaf2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2F6B26"/><stop offset="1" stop-color="#A9C74A"/>
    </linearGradient>
    <linearGradient id="gCake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2373D"/><stop offset="1" stop-color="#A3141F"/>
    </linearGradient>
    <radialGradient id="gBerry" cx=".38" cy=".35" r=".7">
      <stop offset="0" stop-color="#FF6B5E"/><stop offset=".6" stop-color="#D9262F"/><stop offset="1" stop-color="#8A1119"/>
    </radialGradient>
    <radialGradient id="gHeart" cx=".5" cy=".45" r=".6">
      <stop offset="0" stop-color="#FFD860"/><stop offset="1" stop-color="#D98219"/>
    </radialGradient>
  </defs>
</svg>

<main>
  <section class="hero" id="hero" aria-label="Листівка">
    <div class="wreath">
      <svg id="wreath" viewBox="-300 -300 600 600" aria-hidden="true" focusable="false">
        <circle class="ghost" r="228"/>
        <g>
          <path class="stem" pathLength="1" d="M0,-228 A228,228 0 0 1 0,228"/>
          <path class="stem" pathLength="1" d="M0,-228 A228,228 0 0 0 0,228"/>
        </g>
        <g id="leaves"></g>
        <g id="berries"></g>
        <g id="flowers"></g>
      </svg>

      <div class="center">
        <div class="cover">
          <p>Для Оксанки</p>
          <button class="open-btn" id="open" type="button">Відкрити листівку</button>
        </div>
        <h1 class="greet">
          <span class="l1">З днем народження,</span>
          <span class="l3">Оксанко!</span>
        </h1>
      </div>
    </div>

    <button class="next-btn" id="next" type="button" tabindex="-1">
      Далі
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </section>

  <div class="after">
    <section class="scene tree-scene" id="tree-scene" aria-label="Дерево життя з пташками">
      <svg id="tree" viewBox="-300 -250 600 470" aria-hidden="true" focusable="false">
        <g id="t-stems">
          <path class="stem" pathLength="1" style="--d:0s" d="M0,215 C-16,150 16,80 0,10 C-12,-40 4,-90 0,-150"/>
          <path class="stem" pathLength="1" style="--d:.45s" d="M2,90 C-40,62 -100,70 -172,48"/>
          <path class="stem" pathLength="1" style="--d:.45s" d="M-2,90 C40,62 100,70 172,48"/>
        </g>
        <g id="t-leaves"></g>
        <g id="t-flowers"></g>
        <g id="t-birds"></g>
      </svg>
    </section>

    <section class="scene cake-scene" id="cake-scene" aria-labelledby="cake-title">
      <h2 id="cake-title">Задуй свічки</h2>
      <p class="hint" id="hint" aria-live="polite">Торкнись кожного вогника</p>
      <div class="cake-wrap">
        <div class="row" id="row"></div>
        <svg id="cake" viewBox="0 0 300 152" aria-hidden="true" focusable="false"></svg>
      </div>
    </section>

    <footer class="sign">З любов’ю, твій племінник<span>Ярослав</span></footer>
  </div>
</main>

<div class="ambient" id="ambient" aria-hidden="true"></div>
<div class="petals" id="petals" aria-hidden="true"></div>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const R = 228;
  const rad = Math.PI / 180;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const el = (tag, attrs = {}, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const f = n => +n.toFixed(2);

  // Зернятко — основний мазок петриківки: тонкий хвостик біля основи, кругла «голівка» на кінці.
  function seed(L, o = 0, w = L * .3, k = 0) {
    const y = t => f(-(o + L * t));
    return `M0,${f(-o)}` +
      `C${f(w*.12)},${y(.22)} ${f(-w*.3 + k*.4)},${y(.45)} ${f(-w*.55 + k*.8)},${y(.62)}` +
      `C${f(-w*.85 + k)},${y(.82)} ${f(-w*.45 + k)},${y(1)} ${f(w*.06 + k)},${y(1)}` +
      `C${f(w*.6 + k)},${y(1)} ${f(w*.82 + k)},${y(.8)} ${f(w*.55 + k*.8)},${y(.62)}` +
      `C${f(w*.32 + k*.4)},${y(.44)} ${f(w*.1)},${y(.2)} 0,${f(-o)}Z`;
  }
  function leaf(L, o = 0) {
    const y = t => f(-(o + L * t));
    return `M0,${f(-o)}C${f(-L*.24)},${y(.22)} ${f(-L*.28)},${y(.62)} 0,${y(1)}` +
      `C${f(L*.28)},${y(.62)} ${f(L*.24)},${y(.22)} 0,${f(-o)}Z`;
  }
  const group = (parent, x = 0, y = 0, rot = 0, sx = 1, sy = sx) =>
    el('g', { transform: `translate(${f(x)} ${f(y)}) rotate(${f(rot)}) scale(${sx} ${sy})` }, parent);

  // Один мазок, що «малюється»: зовнішня група ставить на місце, внутрішня росте з основи.
  function stroke(parent, { x = 0, y = 0, rot = 0, s = 1, d, fill, delay = 0 }) {
    const inner = el('g', { class: 'grow' }, group(parent, x, y, rot, s));
    inner.style.setProperty('--d', delay.toFixed(3) + 's');
    el('path', { d, fill }, inner);
    return inner;
  }
  function blob(parent, { x = 0, y = 0, delay = 0 }, draw) {
    const inner = el('g', { class: 'grow' }, group(parent, x, y));
    inner.style.setProperty('--d', delay.toFixed(3) + 's');
    draw(inner);
    return inner;
  }

  // ——— Квіти й ягоди (спільні для всіх сцен) ———
  function flowerA(parent, x, y, S, t, rot = 0) {
    const g = group(parent, x, y, rot, S);
    for (let i = 0; i < 12; i++)
      stroke(g, { rot: i * 30, d: seed(44, 9, 15, 2), fill: 'url(#gRed)', delay: t + i * .015 });
    for (let i = 0; i < 12; i++)
      stroke(g, { rot: i * 30 + 15, d: seed(26, 8, 10, 1.5), fill: 'url(#gSun)', delay: t + .14 + i * .012 });
    blob(g, { delay: t + .28 }, c => {
      el('circle', { r: 12.5, fill: '#6E0F17' }, c);
      for (let j = 0; j < 7; j++) {
        const a = j * 360 / 7 * rad;
        el('circle', { cx: f(Math.cos(a) * 6.5), cy: f(Math.sin(a) * 6.5), r: 1.9, fill: '#FFD860' }, c);
      }
      el('circle', { r: 2.2, fill: '#FFD860' }, c);
    });
  }
  function flowerB(parent, x, y, S, t, rot = 0) {
    const g = group(parent, x, y, rot, S);
    for (let i = 0; i < 16; i++)
      stroke(g, { rot: i * 22.5, d: seed(34, 11, 9, 0), fill: 'url(#gMilk)', delay: t + i * .012 });
    blob(g, { delay: t + .24 }, c => {
      el('circle', { r: 14, fill: 'url(#gHeart)' }, c);
      for (let j = 0; j < 12; j++) {
        const a = j * 137.5 * rad, r = 2.8 * Math.sqrt(j + .5);
        el('circle', { cx: f(Math.cos(a) * r), cy: f(Math.sin(a) * r), r: 1.3, fill: '#8A1119' }, c);
      }
    });
  }
  function tulip(parent, x, y, S, t, rot = 0) {
    const g = group(parent, x, y, rot, S);
    stroke(g, { rot: -72, d: leaf(30, 2), fill: 'url(#gLeaf)', delay: t });
    stroke(g, { rot: 72, d: leaf(30, 2), fill: 'url(#gLeaf)', delay: t + .03 });
    stroke(g, { rot: -26, d: seed(52, 4, 18, -3), fill: 'url(#gPink)', delay: t + .08 });
    stroke(g, { rot: 26, d: seed(52, 4, 18, 3), fill: 'url(#gPink)', delay: t + .12 });
    stroke(g, { rot: 0, d: seed(58, 4, 20, 0), fill: 'url(#gRed)', delay: t + .18 });
    stroke(g, { rot: -9, d: seed(30, 6, 8, -1), fill: 'url(#gSun)', delay: t + .3 });
    stroke(g, { rot: 9, d: seed(30, 6, 8, 1), fill: 'url(#gSun)', delay: t + .33 });
  }
  function bell(parent, x, y, S, t, rot = 0) {
    const g = group(parent, x, y, rot, S);
    for (let i = 0; i < 7; i++)
      stroke(g, { rot: -57 + i * 19, d: seed(42, 6, 13, (i - 3) * .8), fill: 'url(#gBlue)', delay: t + i * .02 });
    for (let i = 0; i < 5; i++)
      stroke(g, { rot: -36 + i * 18, d: seed(24, 6, 8, 0), fill: 'url(#gMilk)', delay: t + .18 + i * .02 });
    blob(g, { delay: t + .3 }, c => {
      el('path', { d: 'M-12,0 A12,12 0 0 1 12,0 Z', fill: '#1B3488' }, c);
      el('circle', { cy: -4, r: 2.4, fill: '#FFD860' }, c);
    });
  }
  function berries(parent, x, y, S, t, rot = 0) {
    const g = group(parent, x, y, rot, S);
    stroke(g, { rot: -64, d: leaf(26, 2), fill: 'url(#gLeaf2)', delay: t });
    stroke(g, { rot: 64, d: leaf(26, 2), fill: 'url(#gLeaf)', delay: t + .03 });
    const pts = [[0,-12,7],[-9,-19,6.5],[8.5,-20,7.2],[-1,-28,7.4],[-15,-29,6.2],[14,-30,6.6],[-7,-37,6.8],[7.5,-38,6.4],[0,-46,5.8]];
    pts.forEach(([bx, by, r], i) => blob(g, { x: bx, y: by, delay: t + .08 + i * .03 }, c => {
      el('circle', { r, fill: 'url(#gBerry)' }, c);
      el('circle', { cx: f(-r * .34), cy: f(-r * .34), r: f(r * .24), fill: '#FFFFFF', opacity: .75 }, c);
    }));
  }
  function dots(parent, x, y, t) {
    blob(parent, { x, y, delay: t }, g => {
      el('circle', { r: 3.2, fill: '#F3B531' }, g);
      el('circle', { cx: 7, cy: 3, r: 2, fill: '#F3B531', opacity: .7 }, g);
      el('circle', { cx: -6, cy: 4, r: 1.6, fill: '#F6EEDF', opacity: .7 }, g);
    });
  }

  // Пташка в петриківському стилі; дивиться праворуч, flip — дзеркально.
  function bird(parent, x, y, S, t, flip, bobDelay) {
    const bob = el('g', { class: 'bob' }, group(parent, x, y, 0, flip ? -S : S, S));
    bob.style.setProperty('--b', bobDelay + 's');
    // хвіст-віяло
    const tail = el('g', { class: 'sway' }, group(bob, -34, 4));
    const tf = ['url(#gRed)', 'url(#gSun)', 'url(#gBlue)', 'url(#gMilk)', 'url(#gBlue)', 'url(#gSun)', 'url(#gRed)'];
    const tl = [70, 82, 92, 98, 92, 82, 70];
    for (let i = 0; i < 7; i++)
      stroke(tail, { rot: -108 + i * 12, d: seed(tl[i], 4, tl[i] * .24, 0), fill: tf[i], delay: t + i * .05 });
    // лапки
    blob(bob, { delay: t + .3 }, c => el('path', { d: 'M2,22 L0,36 M12,22 L13,36', stroke: '#F3B531', 'stroke-width': 3, 'stroke-linecap': 'round', fill: 'none' }, c));
    // тулуб
    blob(bob, { delay: t + .25 }, c =>
      el('path', { d: 'M-38,6 C-34,-22 4,-34 30,-24 C44,-18 46,0 38,10 C24,26 -14,30 -38,6 Z', fill: 'url(#gBody)' }, c));
    [[-22, 8], [-10, 0], [2, 10], [-10, 16], [12, -2], [14, 14]].forEach(([fx, fy], i) =>
      stroke(bob, { x: fx, y: fy, rot: -100, d: seed(13, 0, 5, 0), fill: 'url(#gMilk)', delay: t + .4 + i * .03 }));
    // крило
    const wing = el('g', { class: 'flap' }, group(bob, -4, -12));
    const wl = [40, 50, 58, 54, 44];
    const wf = ['url(#gSun)', 'url(#gRed)', 'url(#gSun)', 'url(#gRed)', 'url(#gSun)'];
    for (let i = 0; i < 5; i++)
      stroke(wing, { rot: -80 + i * 14, d: seed(wl[i], 2, wl[i] * .3, 0), fill: wf[i], delay: t + .45 + i * .05 });
    // голова з чубчиком
    blob(bob, { x: 40, y: -34, delay: t + .6 }, c => {
      [-30, 0, 30].forEach(r => el('path', { d: seed(r ? 13 : 17, 0, 6, 0), fill: 'url(#gSun)', transform: `translate(0 -9) rotate(${r})` }, c));
      el('circle', { r: 13, fill: '#24429A' }, c);
      el('path', { d: 'M11,-3 L25,2 L11,6 Z', fill: '#F3B531' }, c);
      el('circle', { cx: 4, cy: -2, r: 4.2, fill: '#F6EEDF' }, c);
      el('circle', { cx: 5, cy: -2, r: 2.1, fill: '#11201B' }, c);
    });
  }

  // ——— 1. Вінок ———
  const fromTop = th => Math.abs(((th + 90) % 360 + 540) % 360 - 180); // 0 зверху … 180 знизу
  const timeAt = th => .2 + fromTop(th) / 180 * 1.5;
  const pos = (th, r = R) => [Math.cos(th * rad) * r, Math.sin(th * rad) * r];
  {
    const L = document.getElementById('leaves');
    const B = document.getElementById('berries');
    const F = document.getElementById('flowers');
    const N = 44;
    for (let i = 0; i < N; i++) {
      const th = -90 + i * 360 / N + 360 / N / 2;
      const right = Math.cos(th * rad) >= 0 ? 1 : -1;
      const t = timeAt(th);
      const [x, y] = pos(th);
      stroke(L, { x, y, rot: th + 90 + right * 42, d: leaf(36 + (i % 3) * 4, 1), fill: i % 2 ? 'url(#gLeaf)' : 'url(#gLeaf2)', delay: t });
      stroke(L, { x, y, rot: th - 90 - right * 48, d: leaf(24 + (i % 2) * 4, 1), fill: i % 2 ? 'url(#gLeaf2)' : 'url(#gLeaf)', delay: t + .06 });
    }
    for (let i = 0; i < 22; i++) {
      const th = -90 + i * 360 / 22 + 8;
      dots(L, ...pos(th, R + 52), timeAt(th) + .35);
    }
    const at = (fn, th, S, r = R, off = .22, orient = false) => {
      const [x, y] = pos(th, r);
      fn(F, x, y, S, timeAt(th) + off, orient ? th + 90 : th);
    };
    [-72, -108, 0, 180].forEach(th => { const [x, y] = pos(th, R + 6); berries(B, x, y, th % 180 ? .9 : .85, timeAt(th) + .3, th + 90); });
    at(flowerA, -90, 1.12);
    at(tulip, -50, .9, R, .2, true); at(tulip, -130, .9, R, .2, true);
    at(flowerB, -16, .9);            at(flowerB, -164, .9);
    at(bell, 22, 1.0, R, .2, true);  at(bell, 158, 1.0, R, .2, true);
    at(flowerA, 56, .92);            at(flowerA, 124, .92);
    at(flowerB, 90, 1.0);
  }

  // ——— 2. Дерево життя з пташками ———
  {
    const L = document.getElementById('t-leaves');
    const F = document.getElementById('t-flowers');
    const Bd = document.getElementById('t-birds');
    const ys = [178, 132, 40, -10, -62, -108];
    ys.forEach((y, i) => {
      const len = 46 - i * 3, t = .15 + (5 - i) * .1;
      stroke(L, { x: 0, y, rot: -62 + i * 3, d: leaf(len, 1), fill: 'url(#gLeaf)', delay: t });
      stroke(L, { x: 0, y: y - 10, rot: 62 - i * 3, d: leaf(len - 4, 1), fill: 'url(#gLeaf2)', delay: t + .05 });
    });
    [[-60, 66, -150], [-112, 64, -30], [-140, 54, -155]].forEach(([x, y, r], i) => {
      stroke(L, { x, y, rot: r, d: leaf(30, 1), fill: 'url(#gLeaf2)', delay: .7 + i * .08 });
      stroke(L, { x: -x, y, rot: -r, d: leaf(30, 1), fill: 'url(#gLeaf2)', delay: .7 + i * .08 });
    });
    berries(F, -84, 74, .8, .95, 180); berries(F, 84, 74, .8, .95, 180);
    tulip(F, -10, 12, .78, 1.0, -48); tulip(F, 10, 12, .78, 1.0, 48);
    flowerB(F, -52, -72, .72, 1.05); flowerB(F, 52, -72, .72, 1.05);
    flowerA(F, 0, -168, 1.18, 1.15);
    [[-120, -150], [120, -150], [-200, -60], [200, -60], [-40, 190], [40, 190], [-230, 120], [230, 120]]
      .forEach(([x, y], i) => dots(F, x, y, 1.3 + i * .05));
    bird(Bd, -150, 10, 1.05, 1.35, false, 2.9);
    bird(Bd, 150, 10, 1.05, 1.5, true, 3.4);
  }

  // ——— 3. Торт ———
  {
    const C = document.getElementById('cake');
    blob(C, { x: 150, y: 142, delay: .1 }, c => el('ellipse', { rx: 146, ry: 9, fill: 'rgba(246,238,223,.12)' }, c));
    blob(C, { x: 150, y: 136, delay: .2 }, c => {
      const g = group(c, -150, -136);
      el('rect', { x: 30, y: 58, width: 240, height: 78, rx: 10, fill: 'url(#gCake)' }, g);
      for (let x = 38; x <= 262; x += 16) el('circle', { cx: x, cy: 60, r: 8, fill: '#F6EEDF' }, g);
      for (let x = 42; x <= 258; x += 18) el('circle', { cx: x, cy: 127, r: 2, fill: '#F3B531' }, g);
    });
    blob(C, { x: 150, y: 58, delay: .45 }, c => {
      const g = group(c, -150, -58);
      el('rect', { x: 70, y: 0, width: 160, height: 60, rx: 8, fill: '#F6EEDF' }, g);
      let d = 'M70,8 Q70,0 78,0 H222 Q230,0 230,8 V14';
      for (let x = 230, i = 0; x > 70; x -= 16, i++) {
        const dep = i % 2 ? 24 : 16;
        d += ` C${x - 2},14 ${x - 3},${dep} ${x - 8},${dep} C${x - 13},${dep} ${x - 14},14 ${x - 16},14`;
      }
      el('path', { d: d + 'Z', fill: '#F3B531' }, g);
    });
    [100, 150, 200].forEach((x, i) => blob(C, { x, y: 40, delay: .8 + i * .08 }, c => {
      for (let k = 0; k < 8; k++) el('path', { d: seed(11, 3, 5, 0), fill: i === 1 ? '#D9262F' : '#4C78E0', transform: `rotate(${k * 45})` }, c);
      el('circle', { r: 3.6, fill: '#F3B531' }, c);
    }));
    [125, 175].forEach((x, i) => blob(C, { x, y: 40, delay: .9 + i * .05 }, c => {
      el('circle', { r: 2.6, fill: '#D9262F' }, c);
      el('circle', { cy: -8, r: 1.8, fill: '#4F9B3B' }, c);
      el('circle', { cy: 8, r: 1.8, fill: '#4F9B3B' }, c);
    }));
    for (let i = 0; i < 7; i++) blob(C, { x: 54 + i * 32, y: 112, delay: 1 + i * .05 }, c => {
      [-40, 0, 40].forEach(r => el('path', { d: seed(r ? 15 : 19, 2, 6, 0), fill: r ? '#F6EEDF' : '#F3B531', transform: `rotate(${r})` }, c));
      el('circle', { cy: 6, r: 2.4, fill: '#F6EEDF' }, c);
    });
  }

  // ——— Свічки ———
  const row = document.getElementById('row');
  const hint = document.getElementById('hint');
  const candles = [
    { body: '#4C78E0', orn: '#F6EEDF', h: 84 },
    { body: '#D9262F', orn: '#F3B531', h: 102 },
    { body: '#4F9B3B', orn: '#F6EEDF', h: 84 },
  ];
  let left = candles.length;
  candles.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'candle';
    b.type = 'button';
    b.style.setProperty('--i', i);
    b.setAttribute('aria-label', `Задути свічку ${i + 1}`);
    const H = c.h, top = 160 - H;
    b.innerHTML =
      `<svg viewBox="0 0 54 160">
        <path class="smoke" d="M27,${top - 8} C21,${top - 18} 33,${top - 26} 27,${top - 36} C22,${top - 44} 30,${top - 50} 28,${top - 58}"/>
        <path class="flame" d="M27,${top - 4} C17,${top - 10} 19,${top - 26} 27,${top - 40} C35,${top - 26} 37,${top - 10} 27,${top - 4}Z" fill="#FFB52E"/>
        <path class="flame" d="M27,${top - 6} C22,${top - 10} 23,${top - 19} 27,${top - 27} C31,${top - 19} 32,${top - 10} 27,${top - 6}Z" fill="#FFF1B8"/>
        <line x1="27" y1="${top}" x2="27" y2="${top - 7}" stroke="#2A1A06" stroke-width="2.4" stroke-linecap="round"/>
        <rect x="13" y="${top}" width="28" height="${H}" rx="6" fill="${c.body}"/>
        <g fill="${c.orn}" opacity=".9">
          <path transform="translate(27 ${top + H * .5}) rotate(-35)" d="${seed(16, 2, 6, -1)}"/>
          <path transform="translate(27 ${top + H * .5}) rotate(35)" d="${seed(16, 2, 6, 1)}"/>
          <path transform="translate(27 ${top + H * .5})" d="${seed(20, 2, 7, 0)}"/>
          <circle cx="27" cy="${top + H * .5 + 9}" r="2.4"/>
        </g>
      </svg>`;
    b.addEventListener('click', () => {
      if (b.classList.contains('out')) return;
      b.classList.add('out');
      b.setAttribute('aria-label', `Свічку ${i + 1} задуто`);
      left--;
      if (left > 0) {
        hint.textContent = left === 1 ? 'Ще один вогник' : `Ще ${left} вогники`;
      } else {
        hint.textContent = 'Хай збудеться!';
        celebrate();
      }
    });
    row.appendChild(b);
  });

  // ——— Пелюстки, квіти від дотику, салют ———
  const PETAL = seed(40, 0, 13, 0);
  const COLORS = ['#D9262F', '#F3B531', '#F6EEDF', '#4C78E0', '#F49AA6', '#6DB84A'];
  function petal(size, fill) {
    const s = document.createElementNS(NS, 'svg');
    s.setAttribute('viewBox', '-15 -44 30 46');
    s.setAttribute('width', f(size * .66));
    s.setAttribute('height', f(size));
    s.innerHTML = `<path d="${PETAL}" fill="${fill}"/>`;
    s.style.left = rnd(0, 100) + 'vw';
    s.style.setProperty('--dx', rnd(-80, 80).toFixed(0) + 'px');
    s.style.setProperty('--r', rnd(-450, 450).toFixed(0) + 'deg');
    s.addEventListener('animationend', () => s.remove());
    return s;
  }
  const top = document.getElementById('petals');
  function petalRain() {
    if (reduce.matches) return;
    for (let i = 0; i < 54; i++) {
      const s = petal(rnd(12, 28), COLORS[i % COLORS.length]);
      s.classList.add('petal');
      s.style.setProperty('--t', rnd(3.2, 6).toFixed(2) + 's');
      s.style.setProperty('--dl', rnd(0, 1.4).toFixed(2) + 's');
      top.appendChild(s);
    }
  }
  function startAmbient() {
    if (reduce.matches) return;
    const box = document.getElementById('ambient');
    setInterval(() => {
      if (document.hidden || box.childElementCount > 16) return;
      const s = petal(rnd(10, 18), COLORS[Math.random() * COLORS.length | 0]);
      s.style.setProperty('--t', rnd(9, 15).toFixed(1) + 's');
      box.appendChild(s);
    }, 900);
  }
  const PALS = [
    ['#D9262F', '#F3B531', '#6E0F17'], ['#F6EEDF', '#F3B531', '#8A1119'], ['#4C78E0', '#F6EEDF', '#1B3488'],
    ['#F49AA6', '#D9262F', '#F3B531'], ['#F3B531', '#D9262F', '#6E0F17'],
  ];
  const BIG = seed(40, 7, 14, 1.5), SMALL = seed(22, 6, 9, 1);
  function bloom(x, y, k = 1) {
    if (reduce.matches) return;
    const [p1, p2, c] = PALS[Math.random() * PALS.length | 0];
    const size = 110 * k;
    const s = document.createElementNS(NS, 'svg');
    s.setAttribute('viewBox', '-60 -60 120 120');
    s.setAttribute('class', 'bloom');
    s.style.cssText = `left:${f(x - size / 2)}px;top:${f(y - size / 2)}px;width:${f(size)}px;height:${f(size)}px`;
    let h = '';
    for (let i = 0; i < 10; i++) h += `<path transform="rotate(${i * 36})" d="${BIG}" fill="${p1}"/>`;
    for (let i = 0; i < 10; i++) h += `<path transform="rotate(${i * 36 + 18})" d="${SMALL}" fill="${p2}"/>`;
    s.innerHTML = h + `<circle r="9" fill="${c}"/><circle r="3" fill="#FFD860"/>`;
    top.appendChild(s);
    setTimeout(() => s.remove(), 2000);
  }
  function celebrate() {
    petalRain();
    for (let i = 0; i < 16; i++)
      setTimeout(() => bloom(rnd(.1, .9) * innerWidth, rnd(.08, .85) * innerHeight, rnd(.6, 1.3)), 150 + i * 140);
  }
  document.addEventListener('click', e => {
    if (!document.body.classList.contains('opened') || e.target.closest('button')) return;
    bloom(e.clientX, e.clientY, rnd(.7, 1.15));
  });

  // ——— Відкриття й поява сцен ———
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('inview'); io.unobserve(e.target); }
  }), { threshold: .3 });
  document.querySelectorAll('.scene').forEach(s => io.observe(s));

  const nextBtn = document.getElementById('next');
  function open() {
    document.body.classList.add('opened');
    document.getElementById('hero').classList.add('inview');
    nextBtn.tabIndex = 0;
    if (!reduce.matches) setTimeout(() => document.getElementById('wreath').classList.add('spin'), 3200);
    setTimeout(startAmbient, 2600);
  }
  document.getElementById('open').addEventListener('click', open);
  nextBtn.addEventListener('click', () => {
    document.getElementById('tree-scene').scrollIntoView({ behavior: reduce.matches ? 'auto' : 'smooth', block: 'start' });
  });
  if (new URLSearchParams(location.search).has('open')) open();
})();
</script>
</body>
</html>
